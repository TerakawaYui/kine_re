[project]
name = "kine-re"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "astropy>=8.0.2",
    "cartopy>=0.26.0",
    "ehtim>=1.3.2",
    "numpy>=2.4.6",
    "scipy",
    "torch>=2.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
